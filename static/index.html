<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>実験レポート用グラフ作成</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='black'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="topbar reveal" style="--i:0">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">グラフ作成</span>
    <span class="brand-sub">実験レポート用</span>
  </div>
  <span id="status" class="status" role="status" aria-live="polite">
    <span class="status-dot" aria-hidden="true"></span><span id="status-text">準備中…</span>
  </span>
  <button id="reset-all" class="ghost" title="データと設定を最初の状態に戻します">最初からやり直す</button>
</header>

<main class="layout">
  <!-- ===================== 左：データ入力 ===================== -->
  <section class="pane pane-data reveal" style="--i:1">
    <h2 class="section-label">データ</h2>
    <p class="hint">1列目が X，2列目以降が Y（系列）．見出しが系列名になります．<br>
      Excel でコピーした範囲は，貼り付けたい左上のセル（見出しごとなら見出しのセル）を選んで ⌘+V．</p>
    <div class="toolbar">
      <button id="row-add" class="pill" title="選択中の行の下に追加">＋ 行</button>
      <button id="row-del" class="pill" title="選択中の行を削除">− 行</button>
      <button id="col-add" class="pill" title="右端に系列を追加">＋ 列</button>
      <button id="col-del" class="pill" title="選択中の列を削除">− 列</button>
      <button id="csv-open" class="pill">CSV を開く</button>
      <button id="clear-data" class="ghost" title="値をすべて消す">クリア</button>
      <input type="file" id="csv-file" accept=".csv,.tsv,.txt,text/csv" hidden>
    </div>
    <div class="table-wrap">
      <table id="grid"></table>
    </div>
  </section>

  <!-- ===================== 中央：プレビュー ===================== -->
  <section class="pane pane-preview reveal" style="--i:2">
    <div class="preview-head">
      <h2 class="section-label">プレビュー</h2>
      <div id="preview-info" class="preview-info"></div>
    </div>
    <div id="preview-box" class="preview-box">
      <img id="preview" alt="グラフのプレビュー">
      <div class="preview-shimmer" aria-hidden="true"></div>
    </div>
    <div id="messages" class="messages"></div>
  </section>

  <!-- ===================== 右：設定 ===================== -->
  <section class="pane pane-settings reveal" style="--i:3" id="settings">

    <details open>
      <summary>グラフの種類</summary>
      <div class="chips" id="chart-types">
        <button class="pill" data-type="scatter">散布図（点のみ）</button>
        <button class="pill" data-type="scatter_line">散布図（直線とマーカー）</button>
        <button class="pill" data-type="line">折れ線</button>
        <button class="pill" data-type="bar">棒グラフ（縦）</button>
      </div>
      <p class="sub-hint" id="chart-note"></p>
      <label>プリセット</label>
      <div class="chips">
        <button class="pill" data-preset="report">レポート用（白黒・58mm・7pt）</button>
        <button class="pill" data-preset="excel">Excel 風</button>
        <button class="pill" data-preset="simple">シンプル</button>
      </div>
    </details>

    <details open>
      <summary>タイトル・凡例</summary>
      <label class="check"><input type="checkbox" id="title-show"> グラフタイトルを表示</label>
      <input type="text" id="title-text" placeholder="グラフタイトル" maxlength="100">

      <label class="check"><input type="checkbox" id="legend-show"> 凡例を表示</label>
      <div class="grid2">
        <label>位置
          <select id="legend-loc">
            <option value="best">自動（重ならない所）</option>
            <option value="upper right">右上</option>
            <option value="upper left">左上</option>
            <option value="lower right">右下</option>
            <option value="lower left">左下</option>
            <option value="outside bottom">下（グラフの外）</option>
            <option value="outside right">右（グラフの外）</option>
          </select>
        </label>
        <label class="check align-end"><input type="checkbox" id="legend-frame"> 枠で囲む</label>
      </div>

      <label class="check"><input type="checkbox" id="labels-show"> データラベル（各点に値を表示）</label>
      <label>小数点以下の桁数
        <input type="number" id="labels-decimals" min="0" max="6" step="1">
      </label>
    </details>

    <details>
      <summary>軸</summary>
      <!-- X 軸 -->
      <label class="check"><input type="checkbox" id="x-label-show"> X 軸ラベルを表示</label>
      <input type="text" id="x-label" placeholder="空欄なら1列目の見出し" maxlength="100">
      <p class="sub-hint" id="x-label-hint"></p>
      <div class="grid3 x-range">
        <label>最小<input type="number" id="x-min" placeholder="自動" step="any"></label>
        <label>最大<input type="number" id="x-max" placeholder="自動" step="any"></label>
        <label>目盛り間隔<input type="number" id="x-step" placeholder="自動" step="any" min="0"></label>
      </div>
      <label class="check x-range"><input type="checkbox" id="x-log"> X 軸を対数目盛りにする</label>

      <!-- Y 軸 -->
      <label class="check spaced"><input type="checkbox" id="y-label-show"> Y 軸ラベルを表示</label>
      <input type="text" id="y-label" placeholder="空欄なら系列の見出し（1系列のとき）" maxlength="100">
      <p class="sub-hint" id="y-label-hint"></p>
      <div class="grid3">
        <label>最小<input type="number" id="y-min" placeholder="自動" step="any"></label>
        <label>最大<input type="number" id="y-max" placeholder="自動" step="any"></label>
        <label>目盛り間隔<input type="number" id="y-step" placeholder="自動" step="any" min="0"></label>
      </div>
      <label class="check"><input type="checkbox" id="y-zero"> Y 軸を 0 から始める</label>
      <label class="check"><input type="checkbox" id="y-log"> Y 軸を対数目盛りにする</label>

      <!-- 見た目 -->
      <div class="grid2 spaced">
        <label>目盛り線
          <select id="grid-mode">
            <option value="none">なし</option>
            <option value="y">横のみ</option>
            <option value="both">縦横</option>
          </select>
        </label>
        <label>目盛りの向き
          <select id="tick-dir">
            <option value="in">内側</option>
            <option value="out">外側</option>
          </select>
        </label>
        <label>軸の枠線
          <select id="frame">
            <option value="box">四方を囲む</option>
            <option value="L">左と下だけ</option>
            <option value="bottom">下だけ（Excel風）</option>
          </select>
        </label>
        <label>軸線の色
          <input type="color" id="axis-color">
        </label>
      </div>
      <label class="check"><input type="checkbox" id="outer-border"> 外枠（図全体を囲む線）</label>
    </details>

    <details>
      <summary>系列</summary>
      <div id="series-list"></div>
    </details>

    <details open>
      <summary>文字・サイズ・保存</summary>
      <div class="grid2">
        <label>英数字のフォント<select id="font-latin"></select></label>
        <label>日本語のフォント<select id="font-jp"></select></label>
        <label>文字の大きさ [pt]<input type="number" id="font-size" min="4" max="30" step="0.5"></label>
      </div>
      <div class="grid2">
        <label>幅 [mm]<input type="number" id="width" min="20" max="300" step="1"></label>
        <label>高さ [mm]<input type="number" id="height" min="20" max="300" step="1"></label>
        <label>解像度（PNG）
          <select id="dpi">
            <option value="150">150 dpi</option>
            <option value="300">300 dpi</option>
            <option value="600">600 dpi</option>
          </select>
        </label>
        <label>背景
          <select id="background">
            <option value="white">白</option>
            <option value="transparent">透明</option>
          </select>
        </label>
      </div>
      <div class="btn-row">
        <!-- 塗りつぶしのボタンは画面全体でこれ 1 つだけ -->
        <button class="primary" data-download="png">PNG を保存</button>
        <button class="pill" data-download="svg">SVG</button>
        <button class="pill" data-download="pdf">PDF</button>
      </div>
    </details>
  </section>
</main>

<!-- ===================== 下：Python コード ===================== -->
<section id="code-panel" class="code-panel reveal" style="--i:4">
  <div class="code-bar">
    <button id="code-toggle" class="ghost tab" aria-expanded="false">
      <span class="chevron" aria-hidden="true"></span>Python コード
    </button>
    <span class="sub-hint">このコードを実行すると，プレビューと同じグラフが保存されます</span>
  </div>
  <div class="code-body">
    <div class="code-block">
      <div class="code-block-head">
        <span>python</span>
        <span class="spacer"></span>
        <button id="code-copy" class="code-action">コピー</button>
        <button id="code-save" class="code-action">.py で保存</button>
      </div>
      <pre><code id="code"></code></pre>
    </div>
  </div>
</section>

<script src="static/app.js"></script>
</body>
</html>
