<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>実験レポート用グラフ作成</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='black'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
<!-- =====================================================================
     上部バー：状態・コード・保存・その他
     ===================================================================== -->
<header class="topbar reveal" style="--i:0">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">グラフ作成</span>
    <span class="brand-sub">実験レポート用</span>
  </div>
  <span id="status" class="status" role="status" aria-live="polite">
    <span class="status-dot" aria-hidden="true"></span><span id="status-text">準備中…</span>
  </span>
  <div class="top-actions">
    <button id="code-toggle" class="ghost" aria-expanded="false" aria-controls="code-panel">コード</button>
    <div class="split">
      <!-- 塗りつぶしのボタンは画面全体でこれ 1 つだけ -->
      <button id="save-main" class="primary">PNG を保存</button>
      <button class="primary split-arrow" data-menu="save-menu" aria-label="保存の設定" aria-haspopup="true"><span class="caret"></span></button>
    </div>
    <button class="ghost icon-btn" data-menu="more-menu" aria-label="その他" aria-haspopup="true">⋯</button>
  </div>

  <!-- 保存の設定 -->
  <div id="save-menu" class="popover" role="dialog" aria-label="保存の設定" hidden>
    <div class="field">
      <span class="field-label">形式</span>
      <div class="segmented" data-bind="output.format">
        <button data-value="png">PNG</button><button data-value="svg">SVG</button><button data-value="pdf">PDF</button>
      </div>
    </div>
    <div class="field" id="dpi-field">
      <span class="field-label">解像度</span>
      <div class="segmented" data-bind="output.dpi" data-kind="int">
        <button data-value="150">150</button><button data-value="300">300</button><button data-value="600">600 dpi</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">背景</span>
      <div class="segmented" data-bind="output.transparent" data-kind="bool">
        <button data-value="false">白</button><button data-value="true">透明</button>
      </div>
    </div>
    <p class="sub-hint" id="save-note"></p>
    <div class="menu-sep"></div>
    <button class="menu-item" id="save-py">Python コード（.py）を保存</button>
  </div>

  <!-- その他 -->
  <div id="more-menu" class="popover menu" role="menu" hidden>
    <button class="menu-item" id="more-code" role="menuitem">Python コードを表示</button>
    <div class="menu-sep"></div>
    <button class="menu-item" id="reset-all" role="menuitem">最初からやり直す</button>
  </div>
</header>

<main class="layout">
  <!-- =====================================================================
       左：データ
       ===================================================================== -->
  <section class="pane pane-data reveal" style="--i:1">
    <div class="pane-head">
      <h2 class="section-label">データ</h2>
      <div class="head-tools">
        <div class="stepper" aria-label="行">
          <span>行</span>
          <button id="row-add" title="選択中の行の下に追加" aria-label="行を追加">＋</button>
          <button id="row-del" title="選択中の行を削除" aria-label="行を削除">−</button>
        </div>
        <div class="stepper" aria-label="列">
          <span>列</span>
          <button id="col-add" title="選択中の列の右に追加" aria-label="列を追加">＋</button>
          <button id="col-del" title="選択中の列を削除" aria-label="列を削除">−</button>
        </div>
        <button class="ghost icon-btn" data-menu="data-menu" aria-label="データのその他の操作" aria-haspopup="true">⋯</button>
      </div>
      <div id="data-menu" class="popover menu" role="menu" hidden>
        <button class="menu-item" id="csv-open" role="menuitem">CSV を読み込む…</button>
        <button class="menu-item" id="clear-data" role="menuitem">値をすべて消す</button>
      </div>
      <input type="file" id="csv-file" accept=".csv,.tsv,.txt,text/csv" hidden>
    </div>
    <p class="hint">1列目が X．見出しのセルに Excel の表を貼り付けられます．列の下の「役割」で，誤差や繰り返し測定の列にできます．右クリックで行・列を挿入・削除．</p>
    <div class="table-wrap">
      <table id="grid"></table>
    </div>
  </section>

  <!-- =====================================================================
       中央：プレビュー
       ===================================================================== -->
  <section class="pane pane-preview reveal" style="--i:2">
    <div class="pane-head">
      <h2 class="section-label">プレビュー</h2>
      <div id="preview-info" class="preview-info"></div>
    </div>
    <div id="preview-box" class="preview-box">
      <img id="preview" alt="グラフのプレビュー">
      <div class="preview-shimmer" aria-hidden="true"></div>
    </div>
    <div id="messages" class="messages"></div>
  </section>

  <!-- =====================================================================
       右：設定（タブ）
       ===================================================================== -->
  <section class="pane pane-settings reveal" style="--i:3" id="settings">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="chart">グラフ</button>
      <button role="tab" data-tab="axes">軸</button>
      <button role="tab" data-tab="series">系列</button>
      <button role="tab" data-tab="text">文字・サイズ</button>
    </div>

    <!-- ---------- グラフ ---------- -->
    <div class="tab-panel" data-panel="chart" role="tabpanel">
      <div class="group">
        <h3>種類</h3>
        <div class="choice-grid segmented-like" data-bind="chart_type">
          <button data-value="scatter">散布図（点のみ）</button>
          <button data-value="scatter_line">散布図（線とマーカー）</button>
          <button data-value="line">折れ線</button>
          <button data-value="bar">棒グラフ（縦）</button>
        </div>
        <p class="sub-hint" id="chart-note"></p>
      </div>

      <div class="group">
        <h3>スタイル</h3>
        <div class="chips">
          <button class="pill" data-preset="report">レポート用（白黒・58mm・7pt）</button>
          <button class="pill" data-preset="excel">Excel 風</button>
          <button class="pill" data-preset="simple">シンプル</button>
        </div>
      </div>

      <div class="group">
        <div class="row-head"><h3>タイトル</h3><input type="checkbox" class="switch" data-bind="title.show" aria-label="タイトルを表示"></div>
        <input type="text" id="title-text" data-bind="title.text" placeholder="グラフタイトル" maxlength="100">
      </div>

      <div class="group">
        <div class="row-head"><h3>凡例</h3><input type="checkbox" class="switch" data-bind="legend.show" aria-label="凡例を表示"></div>
        <div class="grid2 legend-opts">
          <label>位置
            <select data-bind="legend.loc">
              <option value="best">自動（重ならない所）</option>
              <option value="upper right">右上</option>
              <option value="upper left">左上</option>
              <option value="lower right">右下</option>
              <option value="lower left">左下</option>
              <option value="outside bottom">下（グラフの外）</option>
              <option value="outside right">右（グラフの外）</option>
            </select>
          </label>
          <label class="inline-switch">枠<input type="checkbox" class="switch" data-bind="legend.frame"></label>
        </div>
      </div>

      <div class="group">
        <div class="row-head"><h3>データラベル</h3><input type="checkbox" class="switch" data-bind="data_labels.show" aria-label="データラベルを表示"></div>
        <label class="labels-opts">小数点以下の桁数
          <input type="number" data-bind="data_labels.decimals" data-kind="int" min="0" max="6" step="1">
        </label>
      </div>
    </div>

    <!-- ---------- 軸 ---------- -->
    <div class="tab-panel" data-panel="axes" role="tabpanel" hidden>
      <div class="group">
        <div class="row-head"><h3>X 軸</h3><input type="checkbox" class="switch" data-bind="x_axis.show_label" aria-label="X 軸ラベルを表示"></div>
        <input type="text" data-bind="x_axis.label" id="x-label" placeholder="ラベル（空欄なら1列目の見出し）" maxlength="100">
        <p class="sub-hint" id="x-label-hint"></p>
        <div class="grid3 x-num">
          <label>最小<input type="number" data-bind="x_axis.min" data-kind="optnum" placeholder="自動" step="any"></label>
          <label>最大<input type="number" data-bind="x_axis.max" data-kind="optnum" placeholder="自動" step="any"></label>
          <label>間隔<input type="number" data-bind="x_axis.step" data-kind="optnum" id="x-step" placeholder="自動" step="any" min="0"></label>
        </div>
        <div class="grid2 x-num">
          <label>数値の桁
            <select data-bind="x_axis.tick_decimals" data-kind="optint">
              <option value="">自動</option><option value="0">整数</option><option value="1">0.0</option>
              <option value="2">0.00</option><option value="3">0.000</option><option value="4">0.0000</option>
            </select>
          </label>
          <label class="inline-switch">対数目盛り<input type="checkbox" class="switch" data-bind="x_axis.log"></label>
        </div>
        <p class="sub-hint" id="x-cat-note"></p>
      </div>

      <div class="group">
        <div class="row-head"><h3>Y 軸</h3><input type="checkbox" class="switch" data-bind="y_axis.show_label" aria-label="Y 軸ラベルを表示"></div>
        <input type="text" data-bind="y_axis.label" id="y-label" placeholder="ラベル（空欄なら系列の見出し）" maxlength="100">
        <p class="sub-hint" id="y-label-hint"></p>
        <div class="grid3">
          <label>最小<input type="number" data-bind="y_axis.min" data-kind="optnum" placeholder="自動" step="any"></label>
          <label>最大<input type="number" data-bind="y_axis.max" data-kind="optnum" placeholder="自動" step="any"></label>
          <label>間隔<input type="number" data-bind="y_axis.step" data-kind="optnum" id="y-step" placeholder="自動" step="any" min="0"></label>
        </div>
        <div class="grid2">
          <label>数値の桁
            <select data-bind="y_axis.tick_decimals" data-kind="optint">
              <option value="">自動</option><option value="0">整数</option><option value="1">0.0</option>
              <option value="2">0.00</option><option value="3">0.000</option><option value="4">0.0000</option>
            </select>
          </label>
          <label class="inline-switch">対数目盛り<input type="checkbox" class="switch" data-bind="y_axis.log"></label>
        </div>
        <label class="switch-row">0 から始める<input type="checkbox" class="switch" id="y-zero" data-bind="y_axis.start_zero"></label>
      </div>

      <div class="group">
        <h3>目盛り</h3>
        <div class="field">
          <span class="field-label">目盛り線</span>
          <div class="segmented" data-bind="grid">
            <button data-value="none">なし</button><button data-value="y">横</button><button data-value="both">縦横</button>
          </div>
        </div>
        <div class="field">
          <span class="field-label">向き</span>
          <div class="segmented" data-bind="tick_direction">
            <button data-value="in">内側</button><button data-value="out">外側</button>
          </div>
        </div>
        <label class="switch-row">補助目盛り<input type="checkbox" class="switch" data-bind="minor_ticks"></label>
        <label class="switch-row">上と右にも目盛り<input type="checkbox" class="switch" data-bind="ticks_all_sides"></label>
      </div>

      <div class="group">
        <h3>枠</h3>
        <div class="field">
          <span class="field-label">軸の枠線</span>
          <div class="segmented" data-bind="frame">
            <button data-value="box">四方</button><button data-value="L">左と下</button><button data-value="bottom">下だけ</button>
          </div>
        </div>
        <label class="switch-row">軸線の色<input type="color" data-bind="axis_color"></label>
        <label class="switch-row">外枠（図全体を囲む）<input type="checkbox" class="switch" data-bind="outer_border"></label>
      </div>
    </div>

    <!-- ---------- 系列 ---------- -->
    <div class="tab-panel" data-panel="series" role="tabpanel" hidden>
      <p class="sub-hint">誤差棒に「標準偏差」を使うには，表で測定値の右の列の役割を「繰り返し」に，誤差の値が入った列は「±誤差」にします．</p>
      <div id="series-list"></div>
      <div class="group">
        <h3>誤差棒</h3>
        <label class="switch-row">端の横線の長さ [pt]<input type="number" class="short" data-bind="error_capsize" data-kind="num" min="0" max="20" step="0.5"></label>
      </div>
    </div>

    <!-- ---------- 文字・サイズ ---------- -->
    <div class="tab-panel" data-panel="text" role="tabpanel" hidden>
      <div class="group">
        <h3>フォント</h3>
        <div class="grid2">
          <label>英数字<select id="font-latin" data-bind="font.latin"></select></label>
          <label>日本語<select id="font-jp" data-bind="font.jp"></select></label>
        </div>
        <label class="switch-row">文字の大きさ [pt]<input type="number" class="short" data-bind="font.size" data-kind="num" min="4" max="30" step="0.5"></label>
      </div>
      <div class="group">
        <h3>大きさ</h3>
        <div class="grid2">
          <label>幅 [mm]<input type="number" data-bind="size.width_mm" data-kind="num" min="20" max="300" step="1"></label>
          <label>高さ [mm]<input type="number" data-bind="size.height_mm" data-kind="num" min="20" max="300" step="1"></label>
        </div>
        <div class="chips" id="size-chips">
          <button class="pill" data-size="58x45">58 × 45</button>
          <button class="pill" data-size="80x60">80 × 60</button>
          <button class="pill" data-size="120x90">120 × 90</button>
          <button class="pill" data-size="160x100">160 × 100</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- =====================================================================
     下：Python コード（上部の「コード」で開閉）
     ===================================================================== -->
<section id="code-panel" class="code-panel" aria-label="Python コード">
  <div class="code-body">
    <div class="code-block">
      <div class="code-block-head">
        <span>python</span>
        <span class="code-head-note">このコードを実行すると，プレビューと同じグラフが保存されます</span>
        <span class="spacer"></span>
        <button id="code-copy" class="code-action">コピー</button>
        <button id="code-save" class="code-action">.py で保存</button>
        <button id="code-close" class="code-action">閉じる</button>
      </div>
      <pre><code id="code"></code></pre>
    </div>
  </div>
</section>

<!-- 表の右クリックメニュー -->
<div id="ctx-menu" class="popover menu" role="menu" hidden>
  <button class="menu-item" data-act="row-above" role="menuitem">上に行を挿入</button>
  <button class="menu-item" data-act="row-below" role="menuitem">下に行を挿入</button>
  <button class="menu-item" data-act="row-delete" role="menuitem">この行を削除</button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="col-right" role="menuitem">右に列を挿入</button>
  <button class="menu-item" data-act="col-delete" role="menuitem">この列を削除</button>
</div>

<script src="static/app.js"></script>
</body>
</html>
